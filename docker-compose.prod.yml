# Billing (facturation, PIO-VIA) — backend hexagonal, billing.yowyob.com.
# Auth via kernel (client billing-backend, clé cote serveur). Kafka mutualisé. Postgres prive.
services:
  billing-backend:
    image: "${APP_IMAGE:?APP_IMAGE requis}"
    container_name: billing-backend
    pull_policy: always
    restart: unless-stopped
    env_file: [.env]
    environment:
      SPRING_PROFILES_ACTIVE: "prod"
      SERVER_PORT: "8080"
      SERVER_FORWARD_HEADERS_STRATEGY: "framework"
      DB_HOST: "billing-db"
      DB_PORT: "5432"
      DB_NAME: "billing"
      DB_USERNAME: "billing"
      DB_PASSWORD: "${BILLING_DB_PASSWORD:?BILLING_DB_PASSWORD requis dans .env}"
      SPRING_KAFKA_BOOTSTRAP_SERVERS: "yowyob-shared-kafka:9092"
      SPRING_DATA_REDIS_HOST: "billing-redis"
      SPRING_DATA_REDIS_PORT: "6379"
      KERNEL_BASE_URL: "https://kernel-core.yowyob.com"
      KERNEL_CLIENT_ID: "billing-backend"
      KERNEL_API_KEY: "${BILLING_KERNEL_API_KEY:?BILLING_KERNEL_API_KEY requis dans .env}"
      KERNEL_TENANT_ID: "11111111-1111-1111-1111-111111111111"
    healthcheck:
      test: ["CMD-SHELL", "curl -s -o /dev/null http://localhost:8080/actuator/health || exit 1"]
      interval: 20s
      timeout: 10s
      retries: 20
      start_period: 120s
    logging: { driver: "json-file", options: { max-size: "50m", max-file: "5" } }
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.billing.rule=Host(`billing.yowyob.com`)"
      - "traefik.http.routers.billing.entrypoints=websecure"
      - "traefik.http.routers.billing.tls=true"
      - "traefik.http.routers.billing.tls.certresolver=letsencrypt"
      - "traefik.http.routers.billing.priority=100"
      - "traefik.http.services.billing.loadbalancer.server.port=8080"
      - "traefik.docker.network=yowyob"
    depends_on:
      billing-db: { condition: service_healthy }
      billing-redis: { condition: service_healthy }
    networks: [yowyob, billing-net]
  billing-db:
    image: postgres:16-alpine
    container_name: billing-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: "billing"
      POSTGRES_USER: "billing"
      POSTGRES_PASSWORD: "${BILLING_DB_PASSWORD:?BILLING_DB_PASSWORD requis dans .env}"
    volumes: [billing-db-data:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U billing -d billing"]
      interval: 5s
      timeout: 5s
      retries: 12
    networks: [billing-net]
  billing-redis:
    image: redis:7-alpine
    container_name: billing-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes: [billing-redis-data:/data]
    healthcheck: { test: ["CMD","redis-cli","ping"], interval: 10s, timeout: 5s, retries: 5 }
    networks: [billing-net]
volumes:
  billing-db-data:
  billing-redis-data:
networks:
  yowyob: { external: true, name: yowyob }
  billing-net: { name: billing-net }
