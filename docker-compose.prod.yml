# Billing (facturation, PIO-VIA) — backend hexagonal, billing.yowyob.com.
# Auth via kernel (client billing-backend, clé cote serveur). Kafka mutualisé. Postgres prive.
services:
  billing-backend:
    # Plafond memoire (29/09/2026). Ce conteneur tournait sans aucune limite : face aux 47 Go de
    # la machine, la JVM dimensionnait son tas sur la memoire de l'HOTE et non sur ce qu'on lui
    # accorde. La machine ne manque pas de CPU — 77 % d'inactivite — mais de memoire : 12,6 Go de
    # swap occupes sur 16, et c'est cette pagination qui gonfle la charge, pas le calcul.
    # Observe avant plafond : 1,10 Gio.
    #
    # MaxRAMPercentage va AVEC la limite : sans lui, la JVM vise les 47 Go et se ferait tuer par le
    # noyau au lieu de declencher sa ramasse-miettes a temps.
    mem_limit: 2g
    mem_reservation: 1g
    image: "${APP_IMAGE:?APP_IMAGE requis}"
    container_name: billing-backend
    pull_policy: always
    restart: unless-stopped
    env_file: [.env]
    environment:
      # Va AVEC mem_limit : sans lui la JVM vise la memoire de l'HOTE (47 Go) et se ferait
      # tuer par le noyau au lieu de declencher sa ramasse-miettes a temps.
      JAVA_TOOL_OPTIONS: "-XX:MaxRAMPercentage=70 -XX:InitialRAMPercentage=30"
      SPRING_PROFILES_ACTIVE: "prod"
      SERVER_PORT: "8080"
      SERVER_FORWARD_HEADERS_STRATEGY: "framework"
      DB_HOST: "billing-db"
      DB_PORT: "5432"
      DB_NAME: "billing"
      DB_USERNAME: "billing"
      DB_PASSWORD: "${BILLING_DB_PASSWORD:?BILLING_DB_PASSWORD requis dans .env}"
      SPRING_KAFKA_BOOTSTRAP_SERVERS: "yowyob-shared-kafka:9092"
      SPRING_DATA_REDIS_HOST: "billing-redis"
      SPRING_DATA_REDIS_PORT: "6379"
      KERNEL_BASE_URL: "https://kernel-core.yowyob.com/kernel-api"
      KERNEL_CLIENT_ID: "billing-backend"
      KERNEL_API_KEY: "${BILLING_KERNEL_API_KEY:?BILLING_KERNEL_API_KEY requis dans .env}"
      KERNEL_TENANT_ID: "11111111-1111-1111-1111-111111111111"
      # Le code du 24/10 lit comops.kernel.api-key / tenant-id sans défaut ni liaison :
      # Spring les résout depuis ces variables (liaison souple . et - → _).
      COMOPS_KERNEL_API_KEY: "${BILLING_KERNEL_API_KEY:?BILLING_KERNEL_API_KEY requis}"
      COMOPS_KERNEL_TENANT_ID: "11111111-1111-1111-1111-111111111111"
      # Le code du 24/10 donne a Liquibase sa PROPRE adresse (SPRING_DATASOURCE_URL, defaut
      # localhost:5432) : sans ces trois lignes, les migrations visent le conteneur lui-meme.
      SPRING_DATASOURCE_URL: "jdbc:postgresql://billing-db:5432/billing"
      SPRING_DATASOURCE_USERNAME: "billing"
      SPRING_DATASOURCE_PASSWORD: "${BILLING_DB_PASSWORD:?BILLING_DB_PASSWORD requis}"
      # Lien des invitations vendeur (defaut localhost:3000 jusqu ici).
      SELLER_LOGIN_URL: "https://billing.yowyob.com/login"
      SPRING_R2DBC_URL: "r2dbc:postgresql://billing-db:5432/billing"
      SPRING_R2DBC_USERNAME: "billing"
      SPRING_R2DBC_PASSWORD: "${BILLING_DB_PASSWORD:?BILLING_DB_PASSWORD requis}"
      CLIENT_PORTAL_FRONTEND_URL: "https://billing.yowyob.com"
      CLIENT_PORTAL_LOGIN_URL: "https://billing.yowyob.com/client-portal/login"
      # Le .env colle tel quel par le dev porte ses propres noms : on les transmet au code.
      # (environment: l emporte sur env_file, donc les valeurs locales du dev ci-dessus
      # - localhost, Vercel, client demo - ne s appliquent pas.)
      COMOPS_KERNEL_NOTIFICATION_API_KEY: "${KERNEL_NOTIFICATION_API_KEY:-}"
      COMOPS_KERNEL_SERVICE_ACCOUNT_USERNAME: "${KERNEL_SERVICE_USERNAME:-}"
      COMOPS_KERNEL_SERVICE_ACCOUNT_PASSWORD: "${KERNEL_SERVICE_PASSWORD:-}"
    healthcheck:
      test: ["CMD-SHELL", "curl -s -o /dev/null http://localhost:8080/actuator/health || exit 1"]
      interval: 20s
      timeout: 10s
      retries: 20
      start_period: 120s
    logging: { driver: "json-file", options: { max-size: "50m", max-file: "5" } }
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.billing-api.rule=Host(`billing.yowyob.com`) && PathPrefix(`/billing-api`)"
      - "traefik.http.routers.billing-api.entrypoints=websecure"
      - "traefik.http.routers.billing-api.tls=true"
      - "traefik.http.routers.billing-api.tls.certresolver=letsencrypt"
      - "traefik.http.routers.billing-api.priority=100"
      - "traefik.http.middlewares.billing-api-strip.stripprefix.prefixes=/billing-api"
      - "traefik.http.routers.billing-api.middlewares=billing-api-strip"
      - "traefik.http.services.billing-api.loadbalancer.server.port=8080"
      - "traefik.docker.network=yowyob"
    depends_on:
      billing-db: { condition: service_healthy }
      billing-redis: { condition: service_healthy }
    networks: [yowyob, billing-net]
  billing-db:
    image: postgres:16-alpine
    container_name: billing-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: "billing"
      POSTGRES_USER: "billing"
      POSTGRES_PASSWORD: "${BILLING_DB_PASSWORD:?BILLING_DB_PASSWORD requis dans .env}"
    volumes: [billing-db-data:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U billing -d billing"]
      interval: 5s
      timeout: 5s
      retries: 12
    networks: [billing-net]
  billing-redis:
    image: redis:7-alpine
    container_name: billing-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes: [billing-redis-data:/data]
    healthcheck: { test: ["CMD","redis-cli","ping"], interval: 10s, timeout: 5s, retries: 5 }
    networks: [billing-net]
volumes:
  billing-db-data:
  billing-redis-data:
networks:
  yowyob: { external: true, name: yowyob }
  billing-net: { name: billing-net }
